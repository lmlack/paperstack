<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Paperstack self-test</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<pre id="log" style="position:fixed;inset:auto 0 0 0;max-height:40vh;overflow:auto;background:#000;color:#0f0;font-size:11px;z-index:999;margin:0;padding:8px"></pre>
<script type="module">
// Reuses the real index.html markup so the modules wire up against the real DOM.
const page = await fetch('../index.html').then((r) => r.text());
const parsed = new DOMParser().parseFromString(page, 'text/html');
const log = document.getElementById('log');
document.body.insertAdjacentHTML('afterbegin', parsed.body.innerHTML);
window.__results = (async () => {
  const { runSuite } = await import('./suite.js');
  try {
    return await runSuite((line) => { log.textContent += line + '\n'; });
  } catch (err) {
    return [{ name: 'suite crashed', ok: false, detail: `${err?.message}\n${err?.stack}` }];
  }
})();
</script>
</body>
</html>
